<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>FuelTrack Cloud</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM via ESM -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #020617; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border: 3px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .bar-grow { animation: growUp 0.6s ease-out forwards; transform-origin: bottom; transform: scaleY(0); }
        @keyframes growUp { to { transform: scaleY(1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plus, Fuel, Gauge, History, Trash2, TrendingUp, Save, X, AlertCircle, Cloud, Calculator, Calendar, Hash, Settings, Download, BarChart3, ArrowLeft, ChevronDown, PieChart, Pencil } from 'lucide-react';

        // --- CHART COMPONENT ---
        const SimpleBarChart = ({ data, dataKey, colorClass, unit = '', label }) => {
            const total = data.reduce((acc, curr) => acc + curr[dataKey], 0);
            const maxVal = Math.max(...data.map(d => d[dataKey]), 1); 
            
            return (
                <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 mb-6 shadow-sm">
                    <div className="flex justify-between items-end mb-6">
                        <h3 className="text-xs font-bold uppercase text-slate-400 tracking-wider">{label}</h3>
                        <span className="text-sm font-bold text-white bg-slate-800 px-2 py-1 rounded">
                            {unit === 'km' ? total.toLocaleString() + ' km' : total.toLocaleString()}
                        </span>
                    </div>
                    <div className="flex items-end justify-between h-40 gap-1 pt-4 border-t border-slate-800/50">
                        {data.map((item, i) => {
                            const val = item[dataKey];
                            const height = (val / maxVal) * 100;
                            const isZero = val === 0;
                            
                            let displayVal = val;
                            if (val >= 1000) {
                                displayVal = (val / 1000).toFixed(1) + 'k';
                            } else if (val % 1 !== 0) { 
                                displayVal = val.toFixed(1);
                            }

                            return (
                                <div key={i} className="flex-1 flex flex-col justify-end items-center relative h-full group">
                                    {!isZero && (
                                        <div className="absolute -top-5 w-full text-center animate-in fade-in slide-in-from-bottom-1 duration-700">
                                            <span className="text-[9px] font-bold text-slate-300 block">{displayVal}</span>
                                        </div>
                                    )}
                                    <div className="w-full relative flex items-end justify-center h-full rounded-t-md overflow-hidden bg-slate-800/30">
                                        <div 
                                            className={`w-full absolute bottom-0 ${colorClass} opacity-90 transition-all bar-grow rounded-t-sm`} 
                                            style={{ height: `${isZero ? 0 : Math.max(height, 2)}%` }}
                                        ></div>
                                    </div>
                                    <span className="text-[9px] text-slate-500 mt-2 font-medium uppercase">{item.shortName.charAt(0)}</span>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        function FuelTracker() {
            // --- STATE ---
            const [view, setView] = useState('home'); 
            const [entries, setEntries] = useState(() => {
                try { return JSON.parse(localStorage.getItem('fuel_tracker_entries')) || []; } catch { return []; }
            });
            
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null); // Track if we are editing
            const [showSettings, setShowSettings] = useState(false);
            const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('fuel_sheet_url') || '');
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSyncTime, setLastSyncTime] = useState(localStorage.getItem('fuel_last_sync') || 'Never');
            const currentYear = new Date().getFullYear().toString();
            const [selectedYear, setSelectedYear] = useState(currentYear);
            
            const [formData, setFormData] = useState({
                odometer: '', liters: '', priceTotal: '', date: new Date().toISOString().split('T')[0]
            });
            const [error, setError] = useState('');

            // --- PERSISTENCE & SYNC ---
            useEffect(() => {
                localStorage.setItem('fuel_tracker_entries', JSON.stringify(entries));
                if (entries.length > 0) {
                    const years = [...new Set(entries.map(e => e.date.split('-')[0]))];
                    const maxYear = Math.max(...years.map(Number)).toString();
                    if (selectedYear === currentYear && years.includes(maxYear)) setSelectedYear(maxYear);
                }
            }, [entries]);

            const syncToSheet = async (currentEntries) => {
                if (!sheetUrl) return;
                setIsSyncing(true);
                try {
                    await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentEntries) });
                    const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    setLastSyncTime(now);
                    localStorage.setItem('fuel_last_sync', now);
                } catch (err) { console.error(err); } 
                finally { setIsSyncing(false); }
            };

            const pullFromSheet = async () => {
                if (!sheetUrl) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(sheetUrl);
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        const cleanData = data.map(item => ({ ...item, odometer: Number(item.odometer), liters: Number(item.liters), priceTotal: Number(item.priceTotal) })).sort((a, b) => b.odometer - a.odometer);
                        setEntries(cleanData);
                        const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        setLastSyncTime(now);
                        localStorage.setItem('fuel_last_sync', now);
                        setShowSettings(false); 
                    }
                } catch (err) { alert("Could not load from Sheet."); } 
                finally { setIsSyncing(false); }
            };

            // --- CALCULATIONS ---
            const stats = useMemo(() => {
                if (entries.length < 2) return { avgEfficiency: 0, totalCost: 0, totalDistance: 0 };
                const sorted = [...entries].sort((a, b) => b.odometer - a.odometer);
                const latest = sorted[0];
                const oldest = sorted[sorted.length - 1];
                const totalDist = latest.odometer - oldest.odometer;
                const totalFuel = sorted.slice(1).reduce((acc, curr) => acc + parseFloat(curr.liters), 0);
                const totalCost = sorted.reduce((acc, curr) => acc + parseFloat(curr.priceTotal), 0);
                const avgEff = totalFuel > 0 ? (totalDist / totalFuel) : 0;
                return { avgEfficiency: avgEff.toFixed(2), totalCost: totalCost.toFixed(0), totalDistance: totalDist };
            }, [entries]);

            const dashboardData = useMemo(() => {
                const months = Array.from({ length: 12 }, (_, i) => ({
                    shortName: new Date(2000, i, 1).toLocaleString('default', { month: 'short' }),
                    cost: 0, dist: 0, effSum: 0, effCount: 0, avgEff: 0
                }));
                const sorted = [...entries].sort((a, b) => a.odometer - b.odometer);
                sorted.forEach((entry, index) => {
                    if (!entry.date) return;
                    const [yStr, mStr] = entry.date.split('-');
                    if (yStr === selectedYear && parseInt(mStr) - 1 >= 0) {
                        const monthIdx = parseInt(mStr) - 1;
                        months[monthIdx].cost += parseFloat(entry.priceTotal) || 0;
                        if (index > 0) {
                            const prevEntry = sorted[index - 1];
                            const dist = parseFloat(entry.odometer) - parseFloat(prevEntry.odometer);
                            const prevLiters = parseFloat(prevEntry.liters);
                            if (dist > 0) {
                                months[monthIdx].dist += dist;
                                if (prevLiters > 0) {
                                    months[monthIdx].effSum += (dist / prevLiters);
                                    months[monthIdx].effCount += 1;
                                }
                            }
                        }
                    }
                });
                months.forEach(m => {
                    m.cost = Math.round(m.cost);
                    m.dist = Math.round(m.dist);
                    m.avgEff = m.effCount > 0 ? parseFloat((m.effSum / m.effCount).toFixed(1)) : 0;
                });
                return months;
            }, [entries, selectedYear]);

            const years = useMemo(() => {
                const unique = new Set();
                entries.forEach(e => { if (e.date) unique.add(e.date.split('-')[0]); });
                const sortedYears = [...unique].sort((a, b) => b - a);
                return sortedYears.length ? sortedYears : [currentYear];
            }, [entries]);

            const ratePerLiter = useMemo(() => {
                const p = parseFloat(formData.priceTotal), v = parseFloat(formData.liters);
                return (p && v) ? (p / v).toFixed(2) : '0.00';
            }, [formData.priceTotal, formData.liters]);

            // --- HANDLERS ---
            const handleEdit = (entry) => {
                setEditingId(entry.id);
                setFormData({
                    odometer: entry.odometer,
                    liters: entry.liters,
                    priceTotal: entry.priceTotal,
                    date: entry.date
                });
                setShowForm(true);
                setError('');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const newOdo = parseFloat(formData.odometer);
                const newLiters = parseFloat(formData.liters);
                const newPrice = parseFloat(formData.priceTotal);
                
                if (!newOdo || !newLiters || !newPrice) { setError('Fill all fields'); return; }

                // --- VALIDATION LOGIC ---
                const otherEntries = editingId 
                    ? entries.filter(e => e.id !== editingId) // Remove self if editing
                    : entries;
                
                const sortedOthers = [...otherEntries].sort((a, b) => a.odometer - b.odometer);

                // Check conflicts
                const nextEntry = sortedOthers.find(e => e.odometer > newOdo);
                const prevEntry = [...sortedOthers].reverse().find(e => e.odometer < newOdo);

                // If inserting a record that isn't the newest, verify consistency
                // 1. If there is a "next" entry, ensure newOdo < nextEntry
                // 2. If there is a "prev" entry, ensure newOdo > prevEntry (already handled by logic but good to double check gaps)
                
                // Strict Check: Cannot insert if it overlaps an existing ODO exactly
                const exactMatch = sortedOthers.find(e => e.odometer === newOdo);
                if (exactMatch) { setError('A record with this exact Odometer already exists.'); return; }

                // Validation: Odometer logic
                if (sortedOthers.length > 0) {
                    // Case: We are inserting somewhere in the middle
                    if (nextEntry && prevEntry) {
                        // It's valid (between two points)
                    } else if (!nextEntry && prevEntry) {
                        // It's the new newest record
                        // Valid
                    } else if (nextEntry && !prevEntry) {
                        // It's the new oldest record
                        // Valid
                    } else {
                        // Edge case: Logic failure or first record logic
                    }
                    
                    // Hard validation for Newest Record insertion (if not editing historic)
                    if (!editingId && sortedOthers.length > 0 && newOdo <= sortedOthers[sortedOthers.length-1].odometer) {
                         // If not editing, usually we want to prevent accidental back-dated entry unless user intends it.
                         // But since we support historic, we allow it, provided it doesn't clash.
                    }
                }

                // Create Entry
                const entryPayload = { 
                    id: editingId || Date.now(), 
                    odometer: newOdo, 
                    liters: newLiters, 
                    priceTotal: newPrice, 
                    date: formData.date 
                };

                const updatedEntries = [entryPayload, ...otherEntries].sort((a, b) => b.odometer - a.odometer);
                
                setEntries(updatedEntries);
                syncToSheet(updatedEntries);
                setFormData({ odometer: '', liters: '', priceTotal: '', date: new Date().toISOString().split('T')[0] });
                setShowForm(false);
                setEditingId(null);
            };

            const handleDelete = (id) => {
                if(window.confirm('Delete this record?')) {
                    const updatedEntries = entries.filter(entry => entry.id !== id);
                    setEntries(updatedEntries);
                    syncToSheet(updatedEntries);
                }
            };

            const exportToCSV = () => {
                const sortedForExport = [...entries].sort((a, b) => a.odometer - b.odometer);
                let csvContent = "Date,Odometer,Fuel (L),Total Cost,Rate/L,Distance Covered (Km),Efficiency (Km/L)\n";
                sortedForExport.forEach((entry, index) => {
                    let dist = 0; let eff = "Baseline";
                    const rate = (entry.priceTotal / entry.liters).toFixed(2);
                    if (index > 0) {
                        const prevEntry = sortedForExport[index - 1];
                        dist = entry.odometer - prevEntry.odometer;
                        eff = (dist / prevEntry.liters).toFixed(2);
                    }
                    csvContent += `${entry.date},${entry.odometer},${entry.liters},${entry.priceTotal},${rate},${dist},${eff}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `fuel_history.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const getEntryStats = (entry, index, allEntries) => {
                if (index === allEntries.length - 1) return { dist: 0, efficiency: null }; 
                const prevEntry = allEntries[index + 1];
                const dist = entry.odometer - prevEntry.odometer;
                const efficiency = (dist / prevEntry.liters).toFixed(2); 
                return { dist, efficiency };
            };

            // --- VIEW: DASHBOARD ---
            if (view === 'dashboard') {
                return (
                    <div className="min-h-screen bg-slate-950 pb-20">
                        <div className="bg-slate-950/80 border-b border-slate-800 p-4 pt-12 sticky top-0 z-50 backdrop-blur-lg">
                            <div className="max-w-md mx-auto flex items-center justify-between">
                                <button onClick={() => setView('home')} className="flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold transition-colors">
                                    <ArrowLeft className="w-5 h-5" /> Back
                                </button>
                                <h1 className="text-lg font-bold text-white">Analytics</h1>
                                <div className="w-16"></div>
                            </div>
                        </div>

                        <div className="px-4 pt-6 max-w-md mx-auto animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <div className="mb-8 relative group">
                                <div className="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-400">
                                    <Calendar className="w-5 h-5" />
                                </div>
                                <select 
                                    value={selectedYear} 
                                    onChange={(e) => setSelectedYear(e.target.value)}
                                    className="w-full appearance-none bg-slate-900 text-white pl-12 pr-8 py-4 rounded-2xl border border-slate-800 font-bold text-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none shadow-lg transition-all"
                                >
                                    {years.map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500">
                                    <ChevronDown className="w-5 h-5" />
                                </div>
                            </div>

                            {entries.length === 0 ? (
                                <div className="text-center py-20 text-slate-500 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800">
                                    <PieChart className="w-12 h-12 mx-auto mb-4 opacity-20" />
                                    <p>No data available yet.</p>
                                    <button onClick={() => setView('home')} className="mt-4 text-blue-400 text-sm font-bold">Go add a record</button>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <SimpleBarChart data={dashboardData} dataKey="cost" label="Monthly Spending" unit="" colorClass="bg-gradient-to-t from-blue-600 to-blue-400" />
                                    <SimpleBarChart data={dashboardData} dataKey="dist" label="Distance Driven" unit="km" colorClass="bg-gradient-to-t from-violet-600 to-violet-400" />
                                    <SimpleBarChart data={dashboardData} dataKey="avgEff" label="Avg Efficiency (Km/L)" unit="" colorClass="bg-gradient-to-t from-emerald-600 to-emerald-400" />
                                    <div className="text-center text-xs text-slate-600 pb-8 pt-4">Showing data for {selectedYear}</div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- VIEW: HOME ---
            return (
                <div className="min-h-screen bg-slate-950 pb-10">
                    <div className="bg-blue-900/30 border-b border-blue-800/30 p-6 pb-8 pt-12 shadow-xl">
                        <div className="flex justify-between items-start mb-6 max-w-md mx-auto">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-lg"><Fuel className="w-6 h-6 text-white" /></div>
                                <div>
                                    <h1 className="text-2xl font-bold text-white">FuelTrack</h1>
                                    <div className="flex items-center gap-2 text-slate-400 text-xs font-medium mt-0.5">
                                        {isSyncing ? <span className="flex gap-1 items-center text-blue-400"><div className="loader"></div> Syncing...</span> : <span>Sync: {lastSyncTime}</span>}
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setView('dashboard')} className="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg shadow-lg shadow-blue-900/20 transition-colors" title="Dashboard"><BarChart3 className="w-5 h-5" /></button>
                                <button onClick={exportToCSV} className="bg-slate-800 text-slate-200 p-2 rounded-lg"><Download className="w-5 h-5" /></button>
                                <button onClick={() => setShowSettings(true)} className="bg-slate-800 text-slate-200 p-2 rounded-lg"><Settings className="w-5 h-5" /></button>
                            </div>
                        </div>
                        <div className="grid grid-cols-3 gap-3 max-w-md mx-auto">
                            {[
                                { label: 'Avg Km/L', val: stats.avgEfficiency || '-' },
                                { label: 'Total Km', val: stats.totalDistance },
                                { label: 'Spent', val: stats.totalCost }
                            ].map((item, i) => (
                                <div key={i} className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 backdrop-blur-sm">
                                    <div className="text-slate-500 text-[10px] uppercase font-bold tracking-wider mb-1">{item.label}</div>
                                    <div className="text-xl font-bold text-white">{item.val}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="px-4 pt-6 max-w-md mx-auto">
                        {showSettings && (
                            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-6 animate-in fade-in slide-in-from-top-2 shadow-2xl">
                                <h3 className="font-bold text-white mb-4 flex gap-2 items-center"><Cloud className="text-blue-500 w-5 h-5"/> Cloud Setup</h3>
                                <input type="text" value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} placeholder="https://script.google.com/..." className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white mb-4 break-all" />
                                <div className="flex gap-2">
                                    <button onClick={() => {localStorage.setItem('fuel_sheet_url', sheetUrl); if(sheetUrl) pullFromSheet(); else setShowSettings(false);}} className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold text-sm">Save & Sync</button>
                                    <button onClick={() => setShowSettings(false)} className="bg-slate-800 text-white px-4 rounded-lg"><X className="w-5 h-5"/></button>
                                </div>
                            </div>
                        )}

                        {!showForm && !showSettings && (
                            <button onClick={() => { setEditingId(null); setFormData({odometer:'',liters:'',priceTotal:'',date:new Date().toISOString().split('T')[0]}); setShowForm(true); }} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 mb-8 active:scale-95 transition-all">
                                <Plus className="w-5 h-5" /> Add New Fill-up
                            </button>
                        )}

                        {showForm && (
                            <div className="bg-slate-900 p-6 rounded-2xl shadow-2xl mb-8 border border-slate-800">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        {editingId ? <Pencil className="w-4 h-4 text-orange-500" /> : <Plus className="w-4 h-4 text-blue-500" />} 
                                        {editingId ? 'Edit Entry' : 'New Entry'}
                                    </h2>
                                    <button onClick={() => { setShowForm(false); setEditingId(null); }} className="text-slate-500"><X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-5">
                                    {error && <div className="bg-red-900/30 text-red-300 p-3 rounded-lg text-sm flex items-center gap-2"><AlertCircle className="w-4 h-4" />{error}</div>}
                                    <div className="space-y-4">
                                        <div><label className="flex gap-2 text-xs font-bold text-slate-400 mb-2 uppercase"><Calendar className="w-3 h-3" /> Date</label><input type="date" name="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" style={{colorScheme: 'dark'}} /></div>
                                        <div><label className="flex gap-2 text-xs font-bold text-slate-400 mb-2 uppercase"><Hash className="w-3 h-3" /> Odometer</label><input type="number" name="odometer" placeholder="120500" required value={formData.odometer} onChange={e => setFormData({...formData, odometer: e.target.value})} className="w-full p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-xs font-bold text-slate-400 mb-2 uppercase">Fuel (L)</label><input type="number" step="0.01" name="liters" placeholder="35.5" required value={formData.liters} onChange={e => setFormData({...formData, liters: e.target.value})} className="w-full p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" /></div>
                                        <div><label className="block text-xs font-bold text-slate-400 mb-2 uppercase">Cost</label><input type="number" step="0.01" name="priceTotal" placeholder="3500" required value={formData.priceTotal} onChange={e => setFormData({...formData, priceTotal: e.target.value})} className="w-full p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" /></div>
                                    </div>
                                    <div className="bg-blue-900/20 p-4 rounded-xl flex justify-between border border-blue-900/30">
                                        <div className="flex items-center gap-2 text-blue-400"><Calculator className="w-4 h-4" /><span className="text-xs font-bold uppercase">Rate</span></div>
                                        <div className="font-mono font-bold text-blue-300 text-lg">{ratePerLiter} <span className="text-xs font-normal text-blue-500/70">/L</span></div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-all mt-2">
                                        <Save className="w-5 h-5" /> {editingId ? 'Update' : 'Save'} Record
                                    </button>
                                </form>
                            </div>
                        )}

                        <div className="space-y-3">
                            <div className="flex items-center gap-2 text-slate-500 text-xs font-bold uppercase tracking-wider ml-1 mb-3"><History className="w-4 h-4" /> History Log</div>
                            {entries.length === 0 && <div className="text-center py-16 text-slate-600 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800"><Gauge className="w-12 h-12 mx-auto mb-3 opacity-20" /><p>No records yet</p></div>}
                            {entries.map((entry, index) => {
                                const { dist, efficiency } = getEntryStats(entry, index, entries);
                                const rate = (entry.priceTotal / entry.liters).toFixed(2);
                                let effColor = 'text-slate-500';
                                if (efficiency) effColor = parseFloat(efficiency) > parseFloat(stats.avgEfficiency) ? 'text-emerald-400' : 'text-orange-400';
                                return (
                                    <div key={entry.id} className="bg-slate-900 p-5 rounded-xl border border-slate-800 relative group shadow-sm">
                                        <div className="flex justify-between items-start mb-3 pr-16">
                                            <div><div className="text-xs text-slate-500 font-bold uppercase mb-1">{entry.date}</div><div className="text-xl font-bold text-white">{entry.odometer.toLocaleString()} <span className="text-sm font-normal text-slate-500">km</span></div></div>
                                            <div className="text-right"><div className={`text-xl font-bold ${effColor}`}>{efficiency || '--'} <span className="text-xs font-medium text-slate-500">Km/L</span></div>{dist > 0 ? <div className="text-xs text-slate-500 flex justify-end gap-1 mt-0.5"><TrendingUp className="w-3 h-3" />{dist} km</div> : <span className="text-[10px] text-slate-500 bg-slate-800 px-2 py-1 rounded-full mt-1 inline-block uppercase">Baseline</span>}</div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800 mt-3 text-sm">
                                            <div><span className="block text-[10px] uppercase text-slate-500 font-bold mb-0.5">Fuel</span><span className="text-slate-300 font-medium">{entry.liters} L</span></div>
                                            <div><span className="block text-[10px] uppercase text-slate-500 font-bold mb-0.5">Cost</span><span className="text-slate-300 font-medium">{Number(entry.priceTotal).toLocaleString()}</span></div>
                                            <div className="text-right"><span className="block text-[10px] uppercase text-slate-500 font-bold mb-0.5">Rate</span><span className="text-slate-300 font-medium">{rate}/L</span></div>
                                        </div>
                                        <div className="absolute top-4 right-4 flex gap-2">
                                            <button onClick={() => handleEdit(entry)} className="text-slate-600 hover:text-blue-400 p-2 transition-colors"><Pencil className="w-5 h-5" /></button>
                                            <button onClick={() => handleDelete(entry.id)} className="text-slate-600 hover:text-red-400 p-2 transition-colors"><Trash2 className="w-5 h-5" /></button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<FuelTracker />);
    </script>
</body>
</html>
