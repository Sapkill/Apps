<style>
:root{
  --bg:#F4F2EF;--card:#FFFFFF;--ink:#1C1B1A;--muted:#5E5A55;--line:#E4E0DA;--soft:rgba(255,255,255,.62);--field:#F4F2EF;
  --sky:#D6E6FF;--peach:#FFDCC8;--mint:#CDEFDC;--butter:#FFEDA8;--lilac:#E6DCFF;
  --sky-ink:#34476B;--peach-ink:#5E4A3E;--mint-ink:#2F4A3B;--butter-ink:#5E5432;--lilac-ink:#4A3E66;
  --inv:#1C1B1A;--inv-ink:#FFFFFF;--inv-2:#2E2C2A;--inv-muted:#C9C5BF;
  --good:#1F6B44;--warn:#8A3D1A;--warn-bg:#FFF1E8;--bad:#B3261E;--path:#5576B0;
  --shadow:0 6px 24px rgba(28,27,26,.12);
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110;--card:#1E1C1A;--ink:#F3F1EE;--muted:#ABA59E;--line:#34312D;--soft:rgba(255,255,255,.07);--field:#2A2725;
  --sky:#1E2B40;--peach:#3A2619;--mint:#173020;--butter:#363013;--lilac:#29233D;
  --sky-ink:#AFC6EC;--peach-ink:#E9C2AA;--mint-ink:#A8DDBE;--butter-ink:#E6D79B;--lilac-ink:#CDBFF2;
  --inv:#F3F1EE;--inv-ink:#121110;--inv-2:#DAD6D0;--inv-muted:#4A4642;
  --good:#7FD6A4;--warn:#FFB38A;--warn-bg:#3A2219;--bad:#FF8A80;--path:#8FB0EA;--shadow:0 6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#121110;--card:#1E1C1A;--ink:#F3F1EE;--muted:#ABA59E;--line:#34312D;--soft:rgba(255,255,255,.07);--field:#2A2725;
  --sky:#1E2B40;--peach:#3A2619;--mint:#173020;--butter:#363013;--lilac:#29233D;
  --sky-ink:#AFC6EC;--peach-ink:#E9C2AA;--mint-ink:#A8DDBE;--butter-ink:#E6D79B;--lilac-ink:#CDBFF2;
  --inv:#F3F1EE;--inv-ink:#121110;--inv-2:#DAD6D0;--inv-muted:#4A4642;
  --good:#7FD6A4;--warn:#FFB38A;--warn-bg:#3A2219;--bad:#FF8A80;--path:#8FB0EA;--shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.3px}
h1{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px;font-weight:600}
.tiny{font-size:11px;font-weight:700}
.b{font-weight:700}
.mono{font-family:var(--mono)}
.right{text-align:right}
.hide{display:none!important}
.tile{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.t-sky{background:var(--sky)}.t-peach{background:var(--peach)}.t-mint{background:var(--mint)}.t-butter{background:var(--butter)}.t-lilac{background:var(--lilac)}
.t-inv{background:var(--inv);color:var(--inv-ink)}
.t-sky .sub{color:var(--sky-ink)}.t-peach .sub{color:var(--peach-ink)}.t-mint .sub{color:var(--mint-ink)}.t-butter .sub{color:var(--butter-ink)}.t-lilac .sub{color:var(--lilac-ink)}
.big{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-1.5px;line-height:1}
.mid{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.5px;line-height:1.1}
.unit{font-weight:600;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--soft);border:0}
.chip.dark{background:var(--inv);color:var(--inv-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{color:var(--good)}
.pill{height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill.sm{height:38px;padding:0 13px;font-size:13px}
.pill.dark,.btn-primary{background:var(--inv);color:var(--inv-ink)}
.pill.ghost{background:transparent;border:1.5px dashed var(--muted)}
.pill.soft{background:var(--soft)}
.pill.on{background:var(--inv);color:var(--inv-ink)}
.pill.danger{color:var(--bad)}
.pill[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{width:100%;height:56px;border-radius:999px;border:0;font:800 17px var(--display)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn.sm{width:36px;height:36px}
.iconbtn.clear{background:transparent}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;min-height:32px}
.seg button.on{background:var(--inv);color:var(--inv-ink)}
.field{width:100%;height:48px;border-radius:16px;border:1.5px solid transparent;background:var(--field);padding:0 14px;font-size:16px;color:var(--ink);outline:none}
.field:focus{border-color:var(--ink)}
.t-sky .field,.t-peach .field,.t-mint .field,.t-lilac .field,.t-butter .field{background:var(--card)}
textarea.field{height:auto;min-height:120px;padding:12px 14px;line-height:1.5;font-family:var(--mono);font-size:14px}
select.field{appearance:none;-webkit-appearance:none}
.bigin{width:100%;border:0;background:transparent;padding:0;font:800 38px var(--display);letter-spacing:-1px;color:var(--ink);outline:none;min-width:0}
.bigin::placeholder{color:var(--muted);opacity:.55}
label.lbl{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:46px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.bar{position:relative;height:14px;border-radius:7px;background:var(--soft);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--ink)}
.bar>b{position:absolute;top:-4px;width:2px;height:22px;background:var(--warn)}
.t-inv .bar{background:rgba(255,255,255,.18)}.t-inv .bar>i{background:var(--inv-ink)}
.ringseg{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;border:0;text-align:left;min-height:76px;font-weight:700}
.ringseg.done-log{background:var(--sky);color:var(--ink)}.ringseg.done-train{background:var(--mint);color:var(--ink)}.ringseg.done-hab{background:var(--lilac);color:var(--ink)}
.ringseg.open{background:var(--inv-2);color:var(--inv-ink);border:1.5px dashed var(--inv-muted)}
:root[data-theme="dark"] .ringseg.done-log,:root[data-theme="dark"] .ringseg.done-train,:root[data-theme="dark"] .ringseg.done-hab{color:var(--ink)}
.todo{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-top:1px solid rgba(255,255,255,.14);background:transparent;border-left:0;border-right:0;border-bottom:0;color:inherit;padding:0;font-weight:600;width:100%}
:root[data-theme="dark"] .todo{border-top-color:rgba(0,0,0,.12)}
.todo span:last-child{color:var(--inv-muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:22px;padding:10px}
.day{height:60px;border:0;border-radius:14px;background:transparent;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.day.sel{background:var(--inv);color:var(--inv-ink)}
.day.gap{border:1.5px dashed var(--warn);color:var(--warn);background:var(--warn-bg)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.w{background:#5576B0}.dots i.c{background:#D9774A}.dots i.t{background:#3B8A5E}.dots i.h{background:#8467C9}
.sq{display:flex;gap:3px}.sq i{flex:1;height:16px;border-radius:5px;background:var(--ink)}.sq i.x{background:rgba(28,27,26,.18)}.sq i.f{background:var(--path)}.sq i.p{background:transparent;border:1.5px dashed var(--ink)}
:root[data-theme="dark"] .sq i.x{background:rgba(255,255,255,.14)}
.card{background:var(--card);border-radius:22px;padding:14px 16px}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) 14px minmax(0,1fr) 36px;gap:6px;align-items:center}
.setrow input{height:46px;border-radius:14px;border:1.5px solid transparent;background:var(--field);text-align:center;font:600 17px var(--body);min-width:0;width:100%;outline:none;color:var(--ink)}
.setrow input:focus{border-color:var(--ink)}
.setrow input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.setrow input.ghost{border:1.5px dashed var(--muted);background:transparent}
.setrow.bw{grid-template-columns:24px minmax(0,1fr) 36px}
.excard{border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.excard.mint{background:var(--mint)}
.excard.mint .setrow input{background:var(--card)}
.excard .namein{flex:1;min-width:0;border:0;background:transparent;font:700 18px var(--display);padding:4px 0;outline:none;color:var(--ink)}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--inv);color:var(--butter)}
.err{font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:14px;padding:10px 12px}
.ok{color:var(--good)}
.banner{border-radius:20px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--inv);color:var(--inv-ink)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(452px,calc(100% - 28px));height:64px;background:var(--card);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-shadow:var(--shadow);z-index:20}
nav.tabs button{height:48px;min-width:48px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--ink);padding:0 12px}
nav.tabs button.on{background:var(--inv);color:var(--inv-ink);padding:0 16px}
nav.tabs button span{display:none}nav.tabs button.on span{display:inline}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:min(452px,calc(100% - 28px));z-index:19}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:90%}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:min(480px,100%);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
svg text{font-family:var(--body)}
details>summary{cursor:pointer;list-style:none;font-weight:700}
details>summary::-webkit-details-marker{display:none}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center}
.kv .field{height:42px;font-size:15px}
.sr{position:absolute;left:-9999px}
@media (min-width:700px){#app{padding-top:28px}}

input[type=date].field{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date].field::-webkit-date-and-time-value{text-align:left}
.row>.field,.row>input{min-width:0}

</style>

</script>

<script>
/* Lock-in core: pure calculations and the shorthand parser. No DOM access, so it can be unit-tested.
   Every dashboard number is derived here from raw rows (BRD design principle 1). */
(function (root) {
  'use strict';

  // ------------------------------------------------------------------ settings
  var DEFAULTS = {
    height_cm: '', birth_year: '', sex: '', activity_factor: 1.55,
    target_kg_per_week: 0.5, start_date: '', start_weight_kg: '',
    kcal_per_kg: 7700, maint_band: 100, intake_window: 7, intake_min_days: 4,
    ma_window: 7, ma_min: 3, block_size: 4, planned_per_week: 4, caution_pct: 1.0,
    backfill_xp_pct: 50, target_band_pct: 50, chart_measure: 'waist',
    level_xp: '0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000,13000,15500,18500,22000'
  };
  var SETTING_META = [
    ['kcal_per_kg', 'Energy per kg of body-weight change', 'kcal/kg'],
    ['target_kg_per_week', 'Target loss rate', 'kg/week'],
    ['maint_band', 'Maintenance band (either side of zero)', 'kcal/day'],
    ['intake_window', 'Intake averaging window', 'days'],
    ['intake_min_days', 'Minimum logged days in window', 'days'],
    ['ma_window', 'Weight moving-average window', 'days'],
    ['ma_min', 'Minimum readings for moving average', 'count'],
    ['activity_factor', 'Activity factor', 'multiplier'],
    ['block_size', 'Block size', 'sessions'],
    ['planned_per_week', 'Planned sessions per week', 'sessions/week'],
    ['caution_pct', 'Caution threshold, projected loss', '% body weight/week'],
    ['backfill_xp_pct', 'XP for backfilled entries (D3)', '% of normal'],
    ['target_band_pct', 'Target band for weekly badge', '± % of target'],
    ['level_xp', 'Level thresholds (cumulative XP)', 'comma list']
  ];
  var XP = { weight: 10, calories: 10, measure: 5, workout: 30, habit: 5, allHabits: 10, pr: 15 };
  var LIMITS = { weight: [30, 250], calories: [0, 10000] };

  // ------------------------------------------------------------------ small utils
  function num(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/,/g, '');
    if (s === '') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function round(v, dp) { var f = Math.pow(10, dp || 0); return Math.round(v * f) / f; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseD(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmtD(t) { return new Date(t).toISOString().slice(0, 10); }
  function addDays(s, n) { return fmtD(parseD(s) + n * 864e5); }
  function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
  function dow(s) { return new Date(parseD(s)).getUTCDay(); }               // 0 = Sunday
  function weekStart(s) { return addDays(s, -((dow(s) + 6) % 7)); }          // Monday
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(parseD(s)); }
  function todayLocal(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  /** Local timestamp with offset, e.g. 2026-10-04T10:15:00+05:30. Sortable for a single-timezone user. */
  function nowStamp(d) {
    d = d || new Date();
    var off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-'; off = Math.abs(off);
    return todayLocal(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + sign + pad(Math.floor(off / 60)) + ':' + pad(off % 60);
  }
  function range(start, end) { var out = []; for (var d = start; d <= end; d = addDays(d, 1)) out.push(d); return out; }
  function mean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmtNum(v) { return String(round(v, 2)); }

  // ------------------------------------------------------------------ context
  /** Build lookup indexes once per render from the raw tables. */
  function buildCtx(db, today) {
    var settings = {};
    Object.keys(DEFAULTS).forEach(function (k) { settings[k] = DEFAULTS[k]; });
    Object.keys(db.Profile || {}).forEach(function (k) {
      var v = db.Profile[k].value; if (v !== '' && v !== null && v !== undefined) settings[k] = v;
    });
    ['activity_factor', 'target_kg_per_week', 'kcal_per_kg', 'maint_band', 'intake_window', 'intake_min_days', 'ma_window', 'ma_min',
      'block_size', 'planned_per_week', 'caution_pct', 'backfill_xp_pct', 'target_band_pct', 'height_cm', 'birth_year', 'start_weight_kg']
      .forEach(function (k) { var n = num(settings[k]); settings[k] = n === null ? (typeof DEFAULTS[k] === 'number' ? DEFAULTS[k] : null) : n; });

    var daily = {};
    Object.keys(db.DailyLog || {}).forEach(function (d) {
      var r = db.DailyLog[d];
      daily[d] = { date: d, weight: num(r.weight_kg), calories: num(r.calories_kcal), complete: num(r.day_complete) === 1,
        rest: num(r.rest_day) === 1, note: r.note || '', created_at: r.created_at || '', updated_at: r.updated_at || '' };
    });
    var meas = {};
    Object.keys(db.Measurements || {}).forEach(function (k) {
      var r = db.Measurements[k], v = num(r.value); if (v === null) return;
      (meas[r.date] = meas[r.date] || {})[r.measure_id] = { value: v, created_at: r.created_at || '' };
    });
    var setsBy = {};
    Object.keys(db.WorkoutSets || {}).forEach(function (k) {
      var s = db.WorkoutSets[k];
      (setsBy[s.session_id] = setsBy[s.session_id] || []).push({
        set_id: s.set_id, session_id: s.session_id, exercise_id: s.exercise_id, order: num(s.exercise_order) || 0,
        set_no: num(s.set_no) || 0, w: num(s.weight_kg), r: num(s.reps)
      });
    });
    Object.keys(setsBy).forEach(function (k) { setsBy[k].sort(function (a, b) { return a.order - b.order || a.set_no - b.set_no; }); });
    var sessions = Object.keys(db.WorkoutSessions || {}).map(function (k) { return db.WorkoutSessions[k]; })
      .filter(function (s) { return s.status === 'done' && isDate(s.date); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.created_at) < String(b.created_at) ? -1 : 1; });

  // ------------------------------------------------------------------ LOG (daily inputs + backdating)

    L.toast(e.isPlan ? 'Plan saved' : 'Session saved' + (n ? ' · ' + n + ' PR' + (n > 1 ? 's' : '') + '!' : '')); render();
  };
  A.discardDraft = function () { if (hasValues(S.editor) && S.editor.isNew && !confirm('Discard this session?')) return; S.editor = null; L.lsDel(L.LS.draft); V.go('train'); };
  A.deleteSession = function () {
    if (!confirm('Delete this session? It is excluded from all calculations but can be restored from Train › Deleted sessions.')) return;
    put('WorkoutSessions', { session_id: S.editor.session_id, status: 'deleted' }); S.editor = null; L.lsDel(L.LS.draft); L.toast('Session deleted'); V.go('train');
  };

  // ------------------------------------------------------------------ habits
  A.habShift = function (el) { var d = C.addDays(S.habDate || today(), +el.dataset.n); if (d > today()) return; S.habDate = d; render(); };
  CH.habdate = function (el) { if (C.isDate(el.value) && el.value <= today()) { S.habDate = el.value; render(); } else el.value = S.habDate || today(); };
  A.habAdd = function () {
    var n = val('nh-name').trim(), sd = val('nh-start');
    if (!n) { L.toast('Name the habit'); return; } if (!C.isDate(sd)) { L.toast('Pick a start date'); return; }
    put('Habits', { habit_id: C.uid('hab'), name: n, start_date: sd, end_date: '', past_periods: '[]', sort_order: maxOrder('Habits', 'sort_order') + 1 });
    L.toast('Habit added'); render();
  };
  A.habMove = function (el) {
    var c = V.ctx(), t = today(), list = c.habits.filter(function (h) { return C.habitActive(h, t) || h.start_date > t; }), i = list.map(function (h) { return h.habit_id; }).indexOf(el.dataset.id), j = i + +el.dataset.n;
    if (j < 0 || j >= list.length) return;
    var a = list[i], b = list[j], ao = +a.sort_order || i, bo = +b.sort_order || j; if (ao === bo) bo = ao + (j > i ? 1 : -1);
    put('Habits', { habit_id: a.habit_id, sort_order: bo }); put('Habits', { habit_id: b.habit_id, sort_order: ao }); render();
  };
  A.habRename = function (el) {
    var h = S.db.Habits[el.dataset.id];
    V.openModal({ title: 'Rename habit', html: '<p class="small muted" style="margin:0">History keeps the same habit; it shows the new name.</p><label class="lbl" for="m-name">Name</label><input id="m-name" class="field" value="' + esc(h.name) + '">',
      onOk: function () { var n = val('m-name').trim(); if (!n) return V.modalErr('Enter a name.'); put('Habits', { habit_id: h.habit_id, name: n }); S.modal = null; render(); return true; } });
  };
  A.habRetire = function (el) {
    var h = S.db.Habits[el.dataset.id];
    V.openModal({ title: 'Retire “' + h.name + '”', html: '<p class="small muted" style="margin:0">It disappears from this date onward. Past ticks and past day scores are untouched.</p><label class="lbl" for="m-date">Retire from</label><input id="m-date" type="date" class="field" value="' + today() + '">', okLabel: 'Retire',
      onOk: function () { var d = val('m-date'); if (!C.isDate(d)) return V.modalErr('Pick a date.'); put('Habits', { habit_id: h.habit_id, end_date: C.addDays(d, -1) }); S.modal = null; L.toast('Habit retired'); render(); return true; } });
  };
  A.habRestore = function (el) {
    var h = S.db.Habits[el.dataset.id];
    V.openModal({ title: 'Restore “' + h.name + '”', html: '<p class="small muted" style="margin:0">Starts a new active period. The gap while it was retired is not counted as missed.</p><label class="lbl" for="m-date">Active again from</label><input id="m-date" type="date" class="field" value="' + today() + '">', okLabel: 'Restore',
      onOk: function () {
        var d = val('m-date'); if (!C.isDate(d)) return V.modalErr('Pick a date.');
        if (h.end_date && d <= h.end_date) return V.modalErr('Pick a date after ' + h.end_date + ', when it was last active.');
        var past = []; try { past = JSON.parse(h.past_periods || '[]') || []; } catch (e) { past = []; }
        past.push({ start: h.start_date, end: h.end_date });
        put('Habits', { habit_id: h.habit_id, past_periods: JSON.stringify(past), start_date: d, end_date: '' }); S.modal = null; L.toast('Habit restored'); render(); return true;
      } });
  };
  A.habDelete = function (el) {
    var id = el.dataset.id, h = S.db.Habits[id];
    var ticks = Object.keys(S.db.HabitLogs).filter(function (k) { return S.db.HabitLogs[k].habit_id === id; });
    if (ticks.some(function (k) { return +S.db.HabitLogs[k].done === 1; })) { L.toast('This habit has ticks: retire it instead'); return; }
    if (!confirm('Delete “' + h.name + '” permanently? Only allowed because it has no ticks.')) return;
    ticks.forEach(function (k) { L.hardDelete('HabitLogs', k); });
    L.hardDelete('Habits', id); L.toast('Habit deleted'); render();
  };

  // ------------------------------------------------------------------ more: profile, splits, exercises, measures
  A.saveProfile = function () {
    var yr = +today().slice(0, 4), errs = [];
    var h = C.num(val('p-height')), by = C.num(val('p-by')), tg = C.num(val('p-target')), pl = C.num(val('p-planned')), sw = C.num(val('p-sw')), sd = val('p-sd');
    if (val('p-height') && (h === null || h < 100 || h > 250)) errs.push('Height 100–250 cm');
    if (val('p-by') && (by === null || by < yr - 100 || by > yr - 10)) errs.push('Birth year looks wrong');
    if (tg === null || tg < 0 || tg > 1.5) errs.push('Target 0–1.5 kg/week');
    if (pl === null || pl < 1 || pl > 14 || Math.round(pl) !== pl) errs.push('Planned sessions 1–14');
    if (val('p-sw') && (sw === null || sw < 30 || sw > 250)) errs.push('Start weight 30–250 kg');
    if (sd && !C.isDate(sd)) errs.push('Start date');
    if (errs.length) { L.toast('Check: ' + errs.join(', ')); return; }
    L.setSetting('height_cm', h === null ? '' : h); L.setSetting('birth_year', by === null ? '' : by); L.setSetting('sex', val('p-sex'));
    L.setSetting('activity_factor', +val('p-af')); L.setSetting('target_kg_per_week', tg); L.setSetting('planned_per_week', pl);
    L.setSetting('start_date', sd || ''); L.setSetting('start_weight_kg', sw === null ? '' : sw);
    L.toast('Profile saved'); render();
  };
  A.saveSettings = function () {
    var errs = [], vals = {};
    C.SETTING_META.forEach(function (m) {
      var v = val('set-' + m[0]).trim();
      if (m[0] === 'level_xp') { var a = v.split(',').map(C.num); if (a.some(function (x) { return x === null; }) || a.some(function (x, i) { return i && x <= a[i - 1]; })) errs.push('Level thresholds must be ascending numbers'); vals[m[0]] = a.join(','); return; }
      var n = C.num(v); if (n === null || n < 0) { errs.push(m[1]); return; } vals[m[0]] = n;
    });
    if (vals.block_size < 1 || vals.intake_window < 1 || vals.ma_window < 1 || vals.kcal_per_kg <= 0) errs.push('Windows, block size and kcal/kg must be positive');
    if (errs.length) { L.toast('Check: ' + errs.join('; ')); return; }
    Object.keys(vals).forEach(function (k) { L.setSetting(k, vals[k]); }); L.toast('Settings saved'); render();
  };
  A.splitAdd = function () {
    var names = val('ns-name').split(',').map(function (s) { return s.trim(); }).filter(Boolean); if (!names.length) return;
    var o = maxOrder('Splits', 'sort_order');
    names.forEach(function (n) {
      var dupe = Object.keys(S.db.Splits).some(function (k) { return C.normName(S.db.Splits[k].name) === C.normName(n); });
      if (!dupe) put('Splits', { split_id: C.uid('sp'), name: n, sort_order: ++o, active: 1 });
    });
    S.anchor = 'splits'; render();
  };
  A.splitMove = function (el) {
    var list = Object.keys(S.db.Splits).map(function (k) { return S.db.Splits[k]; }).sort(function (a, b) { return (+a.sort_order || 0) - (+b.sort_order || 0); });
    var i = list.map(function (s) { return s.split_id; }).indexOf(el.dataset.id), j = i + +el.dataset.n; if (j < 0 || j >= list.length) return;
    list.forEach(function (s, k) { var o = k === i ? j : k === j ? i : k; if (+s.sort_order !== o + 1) put('Splits', { split_id: s.split_id, sort_order: o + 1 }); });
    S.anchor = 'splits'; render();
  };
  A.splitRename = function (el) {
    var s = S.db.Splits[el.dataset.id];
    V.openModal({ title: 'Rename split', html: '<label class="lbl" for="m-name">Name</label><input id="m-name" class="field" value="' + esc(s.name) + '">',
      onOk: function () { var n = val('m-name').trim(); if (!n) return V.modalErr('Enter a name.'); put('Splits', { split_id: s.split_id, name: n }); S.modal = null; S.anchor = 'splits'; render(); return true; } });
  };
  A.splitArchive = function (el) { var s = S.db.Splits[el.dataset.id]; put('Splits', { split_id: s.split_id, active: +s.active === 0 ? 1 : 0 }); S.anchor = 'splits'; render(); };
  A.exRenameG = function (el) { S.anchor = 'exercises'; renameExercise(el.dataset.id); };
  A.exTypeG = function (el) { var x = S.db.Exercises[el.dataset.id]; put('Exercises', { exercise_id: x.exercise_id, type: x.type === 'bodyweight' ? 'loaded' : 'bodyweight' }); S.anchor = 'exercises'; render(); };
  A.exArchive = function (el) { var x = S.db.Exercises[el.dataset.id]; put('Exercises', { exercise_id: x.exercise_id, archived: +x.archived === 1 ? 0 : 1 }); S.anchor = 'exercises'; render(); };
  A.exMerge = function (el) {
    var a = S.db.Exercises[el.dataset.id], opts = Object.keys(S.db.Exercises).map(function (k) { return S.db.Exercises[k]; }).filter(function (x) { return x.exercise_id !== a.exercise_id && !x.merged_into && +x.archived !== 1; }).sort(function (x, y) { return x.canonical_name.localeCompare(y.canonical_name); });
    var sug = C.similarExercise(S.db, a.canonical_name, a.exercise_id);
    V.openModal({ title: 'Merge “' + a.canonical_name + '” into…', html: '<p class="small muted" style="margin:0">All its sets move to the exercise you pick, its name becomes an alias of that exercise, and history is kept.</p><label class="lbl" for="m-into">Merge into</label><select id="m-into" class="field">' + opts.map(function (x) { return '<option value="' + esc(x.exercise_id) + '"' + (sug && sug.exercise_id === x.exercise_id ? ' selected' : '') + '>' + esc(x.canonical_name) + '</option>'; }).join('') + '</select>', okLabel: 'Merge',
      onOk: function () {
        var bId = val('m-into'), b = S.db.Exercises[bId]; if (!b) return V.modalErr('Pick an exercise.');
        var sids = {};
        Object.keys(S.db.WorkoutSets).forEach(function (k) { var s = S.db.WorkoutSets[k]; if (s.exercise_id === a.exercise_id) { s.exercise_id = bId; sids[s.session_id] = true; } });
        S.batching = true;
        Object.keys(sids).forEach(function (sid) { var sess = S.db.WorkoutSessions[sid]; if (sess) L.putSession({ session_id: sid, date: sess.date }, L.setsOf(sid).map(function (x) { return Object.assign({}, x); })); });
        var al = String(b.aliases || '').split(',').concat([a.canonical_name], String(a.aliases || '').split(',')).map(function (s) { return s.trim(); }).filter(Boolean);
        al = al.filter(function (s, i) { return al.map(C.normName).indexOf(C.normName(s)) === i && C.normName(s) !== C.normName(b.canonical_name); });
        put('Exercises', { exercise_id: bId, aliases: al.join(', ') });
        put('Exercises', { exercise_id: a.exercise_id, archived: 1, merged_into: bId });
        S.batching = false; L.persist(); L.flush();
        S.modal = null; S.anchor = 'exercises'; L.toast('Merged into ' + b.canonical_name); render(); return true;
      } });
  };
  A.measAdd = function () {
    var n = val('nm-name').trim(), u = val('nm-unit').trim(), mn = C.num(val('nm-min')), mx = C.num(val('nm-max'));
    if (!n || !u) { L.toast('Name and unit are needed'); return; }
    if (mn === null || mx === null || mn >= mx) { L.toast('Give a valid min and max for the typo guard'); return; }
    var id = slug(n); while (S.db.MeasureTypes[id]) id += '_';
    put('MeasureTypes', { measure_id: id, name: n, unit: u, active: 1, sort_order: maxOrder('MeasureTypes', 'sort_order') + 1, min: mn, max: mx }); S.anchor = 'measures'; render();
  };
  CH.measActive = function (el) { put('MeasureTypes', { measure_id: el.dataset.id, active: el.checked ? 1 : 0 }); S.anchor = 'measures'; render(); };
  CH.chartMeasure = function (el) { L.setSetting('chart_measure', el.value); };

  // ------------------------------------------------------------------ import Apple Notes (WL-13)
  A.impPreview = function () {
    var text = val('imp-text'); S.importText = text;
    var r = C.parseNotes(text), splitIdx = {}, newSplits = [], exIdx = {}, newEx = [], similar = [], setCount = 0, dupes = 0;
    Object.keys(S.db.Splits).forEach(function (k) { splitIdx[C.normName(S.db.Splits[k].name)] = k; });
    r.sessions.forEach(function (s) {
      var sn = C.normName(s.split);
      if (sn && !(sn in splitIdx) && newSplits.map(C.normName).indexOf(sn) < 0) newSplits.push(s.split);
      s.split_id = sn ? splitIdx[sn] || null : '';
      s.dupe = s.split_id !== null && Object.keys(S.db.WorkoutSessions).some(function (k) { var x = S.db.WorkoutSessions[k]; return x.status === 'done' && x.date === s.date && (x.split_id || '') === s.split_id; });
      if (s.dupe) dupes++;
      s.exercises.forEach(function (x) {
        setCount += x.sets.length;
        var nn = C.normName(x.name);
        if (!C.findExercise(S.db, x.name) && !(nn in exIdx)) { exIdx[nn] = true; newEx.push(x.name); var sim = C.similarExercise(S.db, x.name); if (sim) similar.push([x.name, sim.canonical_name]); }
      });
    });
    S.importPreview = { sessions: r.sessions, errors: r.errors, newSplits: newSplits, newEx: newEx, similar: similar, setCount: setCount, dupes: dupes };
    S.anchor = 'import'; render();
  };
  A.impCommit = function () {
    var ip = S.importPreview; if (!ip) return;
    S.batching = true;
    var splitIdx = {}, o = maxOrder('Splits', 'sort_order');
    Object.keys(S.db.Splits).forEach(function (k) { splitIdx[C.normName(S.db.Splits[k].name)] = k; });
    ip.newSplits.forEach(function (n) { var id = C.uid('sp'); put('Splits', { split_id: id, name: n, sort_order: ++o, active: 1 }); splitIdx[C.normName(n)] = id; });
    var allBw = {};
    ip.sessions.forEach(function (s) { s.exercises.forEach(function (x) { var k = C.normName(x.name); if (!(k in allBw)) allBw[k] = true; if (x.sets.some(function (z) { return z.w !== null; })) allBw[k] = false; }); });
    var n = 0;
    ip.sessions.forEach(function (s) {
      var sid0 = s.split ? splitIdx[C.normName(s.split)] : '';
      var dupe = Object.keys(S.db.WorkoutSessions).some(function (k) { var x = S.db.WorkoutSessions[k]; return x.status === 'done' && x.date === s.date && (x.split_id || '') === sid0; });
      if (dupe) return;
      var rows = [];
      s.exercises.forEach(function (x, i) {
        var ex = C.findExercise(S.db, x.name);
        if (!ex) ex = put('Exercises', { exercise_id: C.uid('ex'), canonical_name: x.name, aliases: '', type: allBw[C.normName(x.name)] && x.sets.length ? 'bodyweight' : 'loaded', archived: 0, merged_into: '' });
        if (!x.sets.length) rows.push({ set_id: C.uid('set'), exercise_id: ex.exercise_id, exercise_order: i + 1, set_no: 0, weight_kg: '', reps: '' });
        x.sets.forEach(function (z, j) { rows.push({ set_id: C.uid('set'), exercise_id: ex.exercise_id, exercise_order: i + 1, set_no: j + 1, weight_kg: z.w === null ? '' : z.w, reps: z.r }); });
      });
      L.putSession({ session_id: C.uid('ses'), date: s.date, split_id: sid0 || '', note: 'Imported from notes', status: 'done' }, rows); n++;
    });
    S.batching = false; L.persist(); L.flush();
    S.importPreview = null; S.importText = ''; L.toast('Imported ' + n + ' sessions'); S.anchor = 'import'; render();
  };

  // ------------------------------------------------------------------ sync & data
  A.syncSave = function () {
    S.sync.url = val('sy-url').trim(); S.sync.secret = val('sy-secret').trim(); L.saveSync();
    if (!L.canSync()) { L.toast('Enter the URL and the secret'); return; }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(S.sync.url)) L.toast('That does not look like an Apps Script /exec URL');
    L.toast('Testing…');
    L.ping().then(function (r) {
      if (r && r.ok) { L.toast('Connected. Pulling…'); return L.pull().then(function (ok) { L.toast(ok ? 'Synced with your sheet' : 'Sync failed: ' + S.sync.error); }); }
      S.sync.status = 'error'; S.sync.error = r && r.error || 'No response'; L.saveSync(); L.refreshSyncPill(); L.toast('Failed: ' + S.sync.error);
    }).catch(function (e) { S.sync.status = 'error'; S.sync.error = 'Could not reach the URL (' + e.message + ')'; L.saveSync(); L.refreshSyncPill(); L.toast(S.sync.error); });
  };
  A.syncPull = function () { L.pull().then(function (ok) { L.toast(ok ? 'Pulled from sheet' : 'Pull failed: ' + S.sync.error); }); };
  A.syncPush = function () { L.flush().then(function (ok) { L.toast(ok ? (L.unsyncedCount() ? 'Partly pushed' : 'Everything pushed') : 'Push failed: ' + (S.sync.error || 'not set up')); }); };
  A.exportJson = function () { L.download('lockin-' + today() + '.json', JSON.stringify({ app: 'lockin', version: 1, exported_at: C.nowStamp(), data: S.db }, null, 1), 'application/json'); };
  A.exportCsv = function () {
    var cols = { Profile: ['setting', 'value', 'updated_at'], DailyLog: ['date', 'weight_kg', 'calories_kcal', 'note', 'day_complete', 'rest_day', 'created_at', 'updated_at'], MeasureTypes: ['measure_id', 'name', 'unit', 'active', 'sort_order', 'min', 'max', 'updated_at'],
      Measurements: ['date', 'measure_id', 'value', 'created_at', 'updated_at'], Splits: ['split_id', 'name', 'sort_order', 'active', 'updated_at'], Exercises: ['exercise_id', 'canonical_name', 'aliases', 'type', 'archived', 'merged_into', 'updated_at'],
      WorkoutSessions: ['session_id', 'date', 'split_id', 'note', 'status', 'created_at', 'updated_at'], WorkoutSets: ['set_id', 'session_id', 'exercise_id', 'exercise_order', 'set_no', 'weight_kg', 'reps'],
      Habits: ['habit_id', 'name', 'start_date', 'end_date', 'past_periods', 'sort_order', 'updated_at'], HabitLogs: ['date', 'habit_id', 'done', 'created_at', 'updated_at'] };
    function q(v) { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var out = '';
    Object.keys(cols).forEach(function (t) {
      out += 'table,' + cols[t].join(',') + '\n';
      Object.keys(S.db[t]).forEach(function (k) { var r = S.db[t][k]; out += t + ',' + cols[t].map(function (c) { return q(r[c]); }).join(',') + '\n'; });
    });
    L.download('lockin-' + today() + '.csv', out, 'text/csv');
  };
  CH.restoreJson = function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(rd.result), data = j.data || j;
        if (!data.DailyLog || !data.Habits) throw new Error('Not a Lock-in backup');
        if (!confirm('Replace the data on this device with this backup and push it to the sheet?')) return;
        var stamp = C.nowStamp();
        L.TABS.forEach(function (t) { S.db[t] = data[t] || {}; });
        S.dirty = {};
        L.TABS.forEach(function (t) { if (t === 'WorkoutSets') return; Object.keys(S.db[t]).forEach(function (k) { S.db[t][k].updated_at = stamp; S.dirty[t + '|' + k] = stamp; }); });
        L.persist(); L.flush(); L.toast('Backup restored'); render();
      } catch (e) { L.toast('Could not read file: ' + e.message); }
    };
    rd.readAsText(f);
  };
  A.runTests = function () { S.testResults = C.runTests(); S.anchor = 'tests'; render(); };

  // ------------------------------------------------------------------ modal
  A.modalOk = function () { if (S.modal && S.modal.onOk) S.modal.onOk(); };
  A.modalClose = function () { V.closeModal(); };
  A.modalBg = function (el, ev) { if (ev.target === el) V.closeModal(); };

  // ------------------------------------------------------------------ wiring
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    if (el.dataset.act === 'modalBg' && ev.target !== el) return;
    var fn = A[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) { var el = ev.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, ev); });
  document.addEventListener('change', function (ev) { var el = ev.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, ev); else { var el2 = ev.target.closest('[data-in]'); if (el2 && el2.type === 'checkbox' && IN[el2.dataset.in]) IN[el2.dataset.in](el2, ev); } });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'f-caladd') { ev.preventDefault(); A.calAdd(); }
    if (ev.key === 'Escape' && S.modal) V.closeModal();
  });
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { if (S.ui.theme === 'system') render(); }); }

  // day rollover: re-render when the date changes while the app stays open
  var lastDay = today();
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); if (S.logDate && S.logDate > lastDay) S.logDate = lastDay; render(); } }, 60000);

  V.seed();
  if (S.editor) S.editor.mode = S.editor.mode || 'grid';
  render();
  if (L.canSync()) L.pull();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();

</script>
